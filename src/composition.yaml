name: "loinc_composition"

reader:
  files:
    - "../data/loinc_composition_edges.tsv"
  format: "csv"
  delimiter: "\t"
  header_mode: 0
  columns:
    - "subject"
    - "object"
    - "object_ontology"
    - "mapping_category"
    - "mapping_logic"

transform: {}

writer:
  node_properties: []
  edge_properties:
    - "id"
    - "category"
    - "subject"
    - "predicate"
    - "object"
    - "primary_knowledge_source"
    - "aggregator_knowledge_source"
    - "knowledge_level"
    - "agent_type"
  min_edge_count: 15000
